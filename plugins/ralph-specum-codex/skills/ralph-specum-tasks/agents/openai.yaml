interface:
  display_name: "Ralph Specum Tasks"
  short_description: "Generate implementation tasks for an active spec"
  default_prompt: "Use $ralph-specum-tasks to load the selected skill manifest in every mode. In interactive mode, classify replies, grill critical delivery decisions, and persist the explicit `approve and delegate` choice with confirm source approve-and-delegate; only exact --quick bypasses questions. Run phase_gate.py check-delegation before dispatch. Require the task agent to record manifest loads and pass check-agent-write with the full identity tuple, including discovery revision, before writing tasks.md. Refuse dispatch or artifact writes on any gate or required-load failure, then ask me to `approve current artifact`, `request changes`, or `continue to implementation`."
policy:
  allow_implicit_invocation: false
