interface:
  display_name: "Ralph Specum Start"
  short_description: "Create or resume a Ralph spec"
  default_prompt: "Use $ralph-specum-start to create or resume a spec and load the selected skill manifest in every mode. In interactive mode, classify replies, grill critical goal decisions, and wait for explicit direction through `approve and delegate`; persist that choice with confirm source approve-and-delegate before research. Only exact --quick bypasses questions. Run phase_gate.py check-delegation before dispatch and require the research agent to record manifest loads and pass check-agent-write with the full identity tuple, including discovery revision, before writing. Refuse dispatch or artifact writes on any gate or required-load failure."
policy:
  allow_implicit_invocation: false
