interface:
  display_name: "Ralph Specum Triage"
  short_description: "Split a large effort into dependency-aware specs"
  default_prompt: "Use $ralph-specum-triage with the epic state and load the selected skill manifest in every mode. In interactive mode, classify replies, grill critical decomposition decisions, and persist the explicit `approve and delegate` choice with confirm source approve-and-delegate; only exact --quick bypasses questions. Run phase_gate.py check-delegation before each unique writer dispatch. Require each writer to record manifest loads and pass check-agent-write with the full identity tuple, including discovery revision, before writing. Refuse dispatch or artifact writes on any gate or required-load failure, then ask me to `approve current artifact`, `request changes`, or `continue to the next spec`."
policy:
  allow_implicit_invocation: false
