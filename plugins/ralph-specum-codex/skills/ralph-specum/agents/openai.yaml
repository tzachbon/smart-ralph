  default_prompt: "Use $ralph-specum step by step. Before artifact delegation, load the selected skill manifest in every mode. In interactive mode, classify replies, finish the critical-decision grill, and persist the explicit `approve and delegate` choice with confirm source approve-and-delegate; only exact --quick records the bypass. Pass phase_gate.py check-delegation. Require the artifact agent to record manifest loads and pass check-agent-write with the full identity tuple, including discovery revision, before writing. Refuse dispatch or artifact writes on any gate or required-load failure. Ask me to `approve current artifact`, `request changes`, or `continue to <named next step>` only when quickMode is false; exact --quick continues after successful gates without prompting."
