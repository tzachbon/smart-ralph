interface:
  display_name: "Ralph Specum Requirements"
  short_description: "Generate requirements for an active spec"
  default_prompt: "Use $ralph-specum-requirements to load the selected skill manifest in every mode. In interactive mode, classify replies, grill critical product decisions, and persist the explicit `approve and delegate` choice with confirm source approve-and-delegate; only exact --quick bypasses questions. Run phase_gate.py check-delegation before dispatch. Require the product agent to record manifest loads and pass check-agent-write with the full identity tuple, including discovery revision, before writing requirements.md. Refuse dispatch or artifact writes on any gate or required-load failure. Ask me to `approve current artifact`, `request changes`, or `continue to design` only when quickMode is false; exact --quick continues after successful gates without prompting."
policy:
  allow_implicit_invocation: false
